<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://paperloom/content/workbench.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:h="http://www.w3.org/1999/xhtml" title="论文翻译大师设置" width="740" height="660">
  <script src="chrome://paperloom/content/settings.js"/>
  <h:main class="workbench">
    <h:header class="dialog-head"><h:h1>论文翻译大师设置</h:h1><h:span id="version" class="version"/></h:header>
    <h:div class="dialog-tabs" role="tablist" aria-label="设置类别">
      <h:button id="tab-model" role="tab" aria-controls="panel-model" aria-selected="true">翻译服务</h:button>
      <h:button id="tab-process" role="tab" aria-controls="panel-process" aria-selected="false" tabindex="-1">文献处理</h:button>
      <h:button id="tab-reading" role="tab" aria-controls="panel-reading" aria-selected="false" tabindex="-1">阅读外观</h:button>
    </h:div>
    <h:div class="dialog-body">
      <h:section id="panel-model" role="tabpanel" aria-labelledby="tab-model" class="settings-panel">
        <h:div class="form-section">
          <h:h2>模型连接</h:h2>
          <h:label class="field">接口地址<h:input id="llm_base_url" placeholder="https://api.openai.com/v1" spellcheck="false"/></h:label>
          <h:label class="field">模型名称<h:input id="llm_model" placeholder="输入服务商提供的模型 ID" spellcheck="false"/></h:label>
          <h:label class="field">API 密钥<h:input id="llm_api_key" type="password" autocomplete="off" placeholder="留空保留已保存的密钥"/></h:label>
          <h:div class="row"><h:button id="testModel">测试连接</h:button><h:button id="loadModel">重新读取配置</h:button></h:div>
        </h:div>
        <h:details class="form-section"><h:summary>高级选项</h:summary><h:div class="details-body">
          <h:label class="field">采样温度<h:input id="llm_temperature" inputmode="decimal" placeholder="留空使用模型默认值"/></h:label>
          <h:label class="checkline"><h:input id="clearKey" type="checkbox"/>保存时清除翻译密钥</h:label>
        </h:div></h:details>
      </h:section>
      <h:section id="panel-process" role="tabpanel" aria-labelledby="tab-process" class="settings-panel" hidden="hidden">
        <h:div class="form-section"><h:h2>识别与翻译</h:h2>
          <h:label class="field" id="recognitionRow">默认识别方案<h:select id="recognitionMode"><h:option value="layout">直接解析 PDF</h:option><h:option value="local">本地 OCR</h:option><h:option value="cloud">云端 OCR</h:option></h:select></h:label>
          <h:label class="field">译文目标语言<h:input id="language" value="zh" list="lang-options" placeholder="zh / en / zh-TW"/></h:label>
          <h:datalist id="lang-options"><h:option value="zh" label="中文"/><h:option value="zh-TW" label="繁体中文"/><h:option value="en" label="英语"/></h:datalist>
          <h:label class="checkline"><h:input id="autoOCR" type="checkbox"/><h:span id="autoOCRLabel">新文献添加后自动识别</h:span></h:label>
          <h:p class="hint">自动识别适用于之后添加且已下载的 PDF。翻译由你手动启动。</h:p>
        </h:div>
        <h:details id="localOptions" class="form-section"><h:summary>本地 OCR 引擎</h:summary><h:div class="details-body">
          <h:p id="localEngineHint" class="hint">可检测已安装的运行环境，也可指定本机引擎路径。</h:p>
          <h:label class="field" id="localEngineRow">本地引擎<h:select id="localEngine"><h:option value="auto">自动检测（GPU 优先）</h:option><h:option value="gpu">PaddleOCR-VL（GPU）</h:option><h:option value="cpu">RapidOCR（CPU）</h:option><h:option value="custom">自定义环境</h:option></h:select></h:label>
          <h:label class="field" id="localBackendRow">运行方式<h:select id="backend"><h:option value="wsl">WSL FastDeploy</h:option><h:option value="local">本机 Python OCR</h:option><h:option value="cloud">飞桨云端 OCR</h:option></h:select></h:label>
          <h:div class="field" id="localRootRow"><h:label for="projectRoot">项目目录</h:label><h:div class="row"><h:input id="projectRoot"/><h:button id="chooseRoot">浏览…</h:button></h:div></h:div>
          <h:label class="field" id="localPythonRow">Python 路径<h:input id="pythonPath"/></h:label>
          <h:label class="field">本地服务地址<h:input id="serviceURL" placeholder="http://127.0.0.1:8765"/></h:label>
          <h:div class="row"><h:button id="detectEngine">检测已安装引擎</h:button><h:button id="downloadEngine">下载安装器</h:button></h:div>
          <h:p id="engineStatus" class="hint" role="status"/>
        </h:div></h:details>
        <h:details id="cloudOptions" class="form-section"><h:summary>飞桨云端 OCR</h:summary><h:div class="details-body">
          <h:p class="hint">云端识别会将选中的 PDF 上传至飞桨 AI Studio。</h:p>
          <h:label class="field">Access Token<h:input id="cloudToken" type="password" autocomplete="off" placeholder="留空保留已保存的密钥"/></h:label>
          <h:label class="checkline"><h:input id="clearCloudToken" type="checkbox"/>保存时清除云端 OCR 密钥</h:label>
        </h:div></h:details>
      </h:section>
      <h:section id="panel-reading" role="tabpanel" aria-labelledby="tab-reading" class="settings-panel" hidden="hidden">
        <h:datalist id="readerFonts"><h:option value="Microsoft YaHei"/><h:option value="SimSun"/><h:option value="SimHei"/><h:option value="Times New Roman"/><h:option value="Georgia"/><h:option value="Arial"/><h:option value="Segoe UI"/><h:option value="Noto Serif CJK SC"/></h:datalist>
        <h:div class="form-section"><h:h2>解析原文</h:h2>
          <h:label class="field">字体<h:input id="ocrFontFamily" list="readerFonts" placeholder="系统默认，或输入已安装的字体"/></h:label>
          <h:div class="field"><h:label for="ocrTextColor">文字颜色</h:label><h:div class="row"><h:input id="ocrTextColor" type="color"/><h:label class="checkline"><h:input id="ocrColorAuto" type="checkbox"/>跟随主题</h:label></h:div></h:div>
        </h:div>
        <h:div class="form-section"><h:h2>译文</h:h2>
          <h:label class="field">字体<h:input id="translationFontFamily" list="readerFonts" placeholder="系统默认，或输入已安装的字体"/></h:label>
          <h:div class="field"><h:label for="translationTextColor">文字颜色</h:label><h:div class="row"><h:input id="translationTextColor" type="color"/><h:label class="checkline"><h:input id="translationColorAuto" type="checkbox"/>跟随主题</h:label></h:div></h:div>
        </h:div>
        <h:button id="resetAppearance">恢复默认外观</h:button>
      </h:section>
    </h:div>
    <h:footer class="dialog-footer settings-footer"><h:div id="status" class="feedback" role="status" aria-live="polite"/><h:span class="spacer"/><h:button id="close">关闭</h:button>
      <h:button id="saveModel" class="primary">保存翻译配置</h:button><h:button id="saveLocal" class="primary" hidden="hidden">保存处理设置</h:button><h:button id="saveAppearance" class="primary" hidden="hidden">保存阅读外观</h:button>
    </h:footer>
  </h:main>
</window>
