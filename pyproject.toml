[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-translation-master"
version = "0.5.0"
description = "论文翻译大师：Zotero 内的论文 OCR、Markdown 与大模型翻译阅读器"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24,<2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "Markdown>=3.7",
    "pydantic>=2.6",
    "pillow>=10.0",
    "bleach>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.7", "paddlepaddle-gpu>=3.3"]
rapidocr = ["rapid-doc[cpu]==0.9.11", "rapidocr==3.10.0", "onnxruntime==1.28.0", "python-dotenv>=1,<2"]
dev = ["pytest>=8.0", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.scripts]
paper-translation-master = "app.cli:main"
paperbridge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
