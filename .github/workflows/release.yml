name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    uses: ./.github/workflows/macos.yml
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev,layout,semantic]"
      - run: npm ci --prefix tests/dom
      - run: python -m pytest tests/unit tests/integration -q
      - name: Build and verify Windows package
        shell: pwsh
        run: |
          python packaging/build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $embed = Join-Path $env:RUNNER_TEMP 'python-3.13.17-embed-amd64.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip' -OutFile $embed
          if ((Get-FileHash -Algorithm SHA256 $embed).Hash.ToLower() -ne '9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38') { throw 'Python download checksum mismatch' }
          $meta = Get-Content -Raw release.json | ConvertFrom-Json
          python scripts/build_cloud_bundle.py --output "dist/release/$($meta.slug)-windows-x64-$($meta.version)" --embed $embed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release
          path: |
            dist/release/*.zip
            dist/release/*.xpi
            dist/release/updates.json
            dist/release/RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0
  publish:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-release
          path: release-assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: macos-arm64
          path: release-assets
      - name: Verify downloads and publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version release.json)
          slug=$(jq -r .slug release.json)
          test "$GITHUB_REF_NAME" = "v$version"
          jq -e '.localOnly != true and .prerelease != true' release.json >/dev/null
          cd release-assets
          for platform in windows-x64 macos-arm64; do
            bundle="$slug-$platform-$version.zip"
            unzip -tq "$bundle"
            unzip -p "$bundle" "*/$slug-$version.xpi" > "$RUNNER_TEMP/$platform.xpi"
            python - "$slug-$version.xpi" "$RUNNER_TEMP/$platform.xpi" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as base, zipfile.ZipFile(sys.argv[2]) as platform:
              assert set(base.namelist()) == set(platform.namelist())
              for name in base.namelist():
                  assert base.read(name) == platform.read(name), name
          PY
          done
          sha256sum *.zip *.xpi updates.json > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "论文翻译大师 $version · Windows / macOS" \
            --notes-file RELEASE_NOTES.md *.zip *.xpi updates.json SHA256SUMS
