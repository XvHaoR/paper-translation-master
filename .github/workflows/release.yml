name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: npm ci --prefix tests/dom
      - run: python -m pytest tests/unit tests/integration -q
      - name: Build portable packages and Windows installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python packaging/build_release.py --installer --tag $env:GITHUB_REF_NAME
          } else {
            python packaging/build_release.py --installer
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build model-free Windows cloud bundle
        shell: pwsh
        run: |
          $embed = Join-Path $env:RUNNER_TEMP 'python-3.13.17-embed-amd64.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip' -OutFile $embed
          if ((Get-FileHash -Algorithm SHA256 $embed).Hash.ToLower() -ne '9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38') { throw 'Python download checksum mismatch' }
          $meta = Get-Content -Raw release.json | ConvertFrom-Json
          $bundleDir = "dist/release/$($meta.slug)-windows-x64-$($meta.version)"
          python scripts/build_cloud_bundle.py --output $bundleDir --embed $embed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Get-Item "$bundleDir.zip"
          $sum = (Get-FileHash -Algorithm SHA256 $bundle.FullName).Hash.ToLower()
          Add-Content -Encoding ascii dist/release/SHA256SUMS "$sum  $($bundle.Name)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $release = Get-Content -Raw release.json | ConvertFrom-Json
          $assets = Get-ChildItem dist/release -File | Where-Object Name -ne 'RELEASE_NOTES.md' | ForEach-Object FullName
          $options = @('--verify-tag', '--title', "$($release.name) $($release.version)", '--notes-file', 'dist/release/RELEASE_NOTES.md')
          if ($release.prerelease) { $options += '--prerelease' }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists; preserving reviewed uploaded assets."
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME @options @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
