name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: runtime/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install -r runtime/requirements.txt
      - run: python install.py --check
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_tasks.cjs
      - run: node tests/test_attachment_groups.cjs
      - name: Build and check release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python tools/package.py --tag $env:GITHUB_REF_NAME
          } else {
            python tools/package.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; preserving published assets.'
            exit 0
          }
          $release = Get-Content -Raw runtime/release.json | ConvertFrom-Json
          $assets = Get-ChildItem dist/release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "论文翻译大师 $($release.version) · 本地解析" --notes-file CHANGELOG.md @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
